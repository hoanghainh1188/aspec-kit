# kit-ci — CI for the aspec-kit repository itself (CLI package, versions, sample feature).
# NOT scaffolded into user projects (listed in .aspecignore / DEFAULT_EXCLUDES).
name: kit-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit + end-to-end tests (local template, no network)
        working-directory: packages/aspec-kit
        run: npm test

      - name: Scaffold from current commit and verify the generated project
        run: |
          ASPEC_KIT_TEMPLATE_DIR="$GITHUB_WORKSPACE" \
            node packages/aspec-kit/bin/run.js init "$RUNNER_TEMP/demo" -y --clean --steward @ci-bot
          cd "$RUNNER_TEMP/demo"
          test ! -e .github/workflows/publish-npm.yml
          test ! -e packages
          test ! -e examples
          test -f .claude/scripts/convert-design.py
          python3 .github/scripts/check-template.py
          bash -n bootstrap.sh
          echo "✓ Scaffolded project is valid"

  converter:
    name: Design converter tests (uv + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # PEP 723 inline deps (openpyxl, pdfplumber, reportlab) are resolved by uv itself
      - name: Run converter tests
        run: uv run --script packages/aspec-kit/test/convert/test_convert_design.py
      - name: Convert the sample workbook through the CLI
        run: |
          mkdir -p "$RUNNER_TEMP/p/docs/02-detail-design/demo"
          cp packages/aspec-kit/test/convert/fixtures/detail-design-sample.xlsx "$RUNNER_TEMP/p/docs/02-detail-design/demo/"
          cd "$RUNNER_TEMP/p"
          node "$GITHUB_WORKSPACE/packages/aspec-kit/bin/run.js" convert docs/02-detail-design/demo/detail-design-sample.xlsx
          grep -q "| 1 | 予約者名 | 文字列 | 50 | ○ |" "docs/02-detail-design/demo/detail-design-sample__02_画面項目定義.md"
          grep -q "Converted \`detail-design-sample.xlsx\`" docs/02-detail-design/demo/CHANGELOG.md

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/sync-version.mjs --check
      # A branch merge once shipped raw conflict markers in the npm README (fixed in the README-consolidation PR)
      - name: No unresolved merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!*.png'; then
            echo "::error::Unresolved merge-conflict markers found"
            exit 1
          fi

  sample-feature:
    name: Sample feature tests (Article W evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run without adding a root package.json, so the template stays stack-agnostic
      - name: Run sample tests with Vitest
        run: |
          npx --yes vitest@3 run src/features/example-reservation examples/01-reservation-app/src/features/conference-room-reservation
          python3 .claude/scripts/traceability.py check --root examples/01-reservation-app --strict
          python3 .claude/scripts/qa_sheet.py summary examples/01-reservation-app/docs/qa/001-conference-room-reservation.md > /dev/null
          python3 .claude/scripts/test_spec.py summary examples/01-reservation-app/docs/test-specs/001-conference-room-reservation.md > /dev/null
          python3 .claude/scripts/progress_report.py validate examples/01-reservation-app/docs/reports/2026-10-31-conference-room-reservation.md
