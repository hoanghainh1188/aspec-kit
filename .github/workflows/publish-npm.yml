name: publish-npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade to latest npm (required for native OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Verify git tag matches committed versions and extract CHANGELOG release notes
        run: |
          # The CLI downloads its template from tag v<package.json version>, so the tagged
          # commit itself must carry that version. Fail instead of patching it in CI only.
          # Fix locally: node .github/scripts/sync-version.mjs <version> → commit → re-tag.
          node .github/scripts/sync-version.mjs --check "$GITHUB_REF_NAME"
          node .github/scripts/sync-version.mjs --extract-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Verify template integrity before release
        run: |
          python3 .github/scripts/check-template.py
          bash -n bootstrap.sh
          bash -n .claude/hooks/format.sh

      - name: Run CLI tests
        working-directory: packages/aspec-kit
        run: npm test

      - name: Publish to npmjs.com via OIDC Trusted Publisher
        run: |
          cd packages/aspec-kit
          npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
