name: publish-npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade to latest npm (required for native OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Sync package.json version with git tag
        run: |
          # Extract version number by stripping the leading 'v' (e.g. v0.1.1 -> 0.1.1)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Setting package.json version to: $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --prefix packages/aspec-kit

      - name: Verify template integrity before release
        run: |
          python3 .github/scripts/check-template.py
          bash -n bootstrap.sh
          bash -n .claude/hooks/format.sh

      - name: Publish to npmjs.com via OIDC Trusted Publisher
        run: |
          cd packages/aspec-kit
          npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
