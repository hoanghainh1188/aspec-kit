name: template-smoke-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra các file cấu hình tồn tại
        run: |
          test -f CLAUDE.md
          test -f bootstrap.sh
          test -f .claude/settings.json
          test -f .claude/agents/design-intake.md
          test -f .claude/agents/code-reviewer.md
          test -f .claude/agents/security-reviewer.md
          test -f .claude/agents/glossary-steward.md
          test -f .claude/agents/impact-analyzer.md
          test -f .claude/hooks/format.sh
          test -f .claude/commands/design-to-code.md
          test -f .claude/commands/design-change.md
          test -f .claude/commands/qa-sheet.md
          test -f .claude/commands/progress-report.md
          test -f .claude/scripts/qa_sheet.py
          test -f .claude/scripts/progress_report.py
          test -f docs/00-glossary.md
          test -f docs/05-lessons.md
          test -f docs/CONSTITUTION_APPEND.md
          test -f .github/scripts/check-template.py
          # Plugin metadata only exists in the kit repo (the CLI does not scaffold it)
          if [ -d .claude-plugin ]; then
            test -f .claude-plugin/plugin.json
            test -f .claude-plugin/marketplace.json
          fi
          echo "✓ Cấu trúc template hợp lệ"

      - name: Kiểm tra nội dung template (link/frontmatter/step/mermaid)
        run: python3 .github/scripts/check-template.py

      - name: Test script 質問票 (qa_sheet.py) + CSV mẫu khớp sheet mẫu
        run: |
          python3 -m unittest discover -s .claude/scripts -v
          if [ -f docs/qa/000-example-reservation.md ]; then
            cp docs/qa/000-example-reservation.csv /tmp/qa-expected.csv
            python3 .claude/scripts/qa_sheet.py export docs/qa/000-example-reservation.md
            cmp docs/qa/000-example-reservation.csv /tmp/qa-expected.csv
          fi
          if [ -f docs/reports/2026-10-31-example-reservation.md ]; then
            python3 .claude/scripts/progress_report.py validate docs/reports/2026-10-31-example-reservation.md
          fi

      - name: Kiểm tra shell script hợp lệ (dry run)
        run: |
          bash -n bootstrap.sh
          bash -n .claude/hooks/format.sh

      - name: Kiểm tra JSON hợp lệ
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if [ -f "$f" ]; then python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; fi
          done
          echo "✓ JSON hợp lệ"
